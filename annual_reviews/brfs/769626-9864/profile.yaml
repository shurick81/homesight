  report: |
    New houses (2017), no stambyte for decades. The risks are financial and organisational: a tiny
    self-run association (6 homes, lay internal auditor, no maintenance fund), 9.16 MSEK of loans
    (11 088 kr/m²) all resetting in March–April 2026 from 3.04–3.14% (1.39% in 2021), cash of 57 947 kr at
    the end of 2025, losses every year (−406 261 kr in 2025), and fee income cut 31% in 2025 with an
    increase announced for 2026. Three of the six homes were for sale in October 2026.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  Sources: 2025 from the Svensk Fastighetsförmedling listing of Åvägen 11E (public link); 2021 from Booli (document behind Booli login, link given by the user). 2024 from a HusmanHagberg listing (Åvägen 11A; file served by api.husmanhagberg.se), entered by hand from its text layer (the font drops å/ä/ö, the figures are intact; checked against the note totals and the cash flow). Not held: 2018 (allabrf, login), 2022–2023.
  2021 has no kassaflödesanalys and no notes on revenue or costs: only RR and BR lines are extracted; cash (2) is BR Kassa och bank.
  RR "Övriga rörelsekostnader" holds the operating costs (note 3: el, sophämtning, försäkring, förvaltning, underhåll) and is mapped to Driftkostnader (1).
  2025 BR shows long-term loans as −47 000 and short-term as 9 206 000 (stored as printed); together 9 159 000 = the loan note.
  2021 equity: BR 29 670 141 vs 29 670 201 in the equity table (p5); the BR is used.
  2025: the text layer drops å/ä/ö on some pages; names and the land sentence were confirmed on the page image where needed.
