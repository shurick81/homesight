data_notes: 'Kärrtorp, a small association: 24 bostadsrätter (2 216 kvm), 1 hyresrätt (76 kvm), 13 parking places and 11 garages,
  on tomträtt. Fastighetsägarna-style report: one Drift- och fastighetskostnader note (including förvaltning, 29) with an
  Underhåll section. No cash flow statement, so no cash is stored. 2019 (a scan, entered by hand), 2022 and 2025 (attached to a Fastighetsbyrån listing; the 2025 KF opening liquidity is in restatements.csv) are found; 2020-2021 and 2023-2024 are not public. In 2025 the note prints no current-year insurance premium (2024: 27 398). In 2019 the Underhåll section (8 234 375, mostly a stambyte) is 31.'
