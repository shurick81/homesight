    basis: Original 2013 pipes; usually 40–50 years. Nothing planned beyond the 2021 stamspolning.
  report: |
    New building (2013) with original pipes; stamspolning in all apartments in 2021. No stambyte for
    decades. What matters sooner: 51.5 MSEK of loans (9 419 kr/m²), of which 32.8 MSEK had rates resetting
    in 2023 from 0.69–2.26%, so interest costs will have risen sharply after 2022; fees rose 4% in 2022 and
    4% in 2023; a moisture damage in the garage (a warranty claim from construction) was unresolved in 2022.
    The 2023–2025 reports are not public, so none of this can be followed past 2022.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  Not public: 2020, 2023 and 2025 (handed out to members and on Mitt HSB only; the HSB page lists 2007–2008, 2010–2019, 2021–2022).
  2024 is public on allabrf.se (tools/brf/allabrf.py).
  2021 is a scanned report (OCR); every value checked against its note total or the RR/BR sums.
  2021 counts 67 garage and parking places in one number (cat 6); 2022 lists 20 garage (3) + 48 p-platser (4).
  2021 Övriga externa kostnader: note lines sum to 110 207 vs 110 206 printed (rounding); 2022 Driftkostnader likewise 1 kr.
  The property was bought through a company (RedU9): a deferred tax of 15 457 000 kr over book value is valued at 0 (2022 p13).
