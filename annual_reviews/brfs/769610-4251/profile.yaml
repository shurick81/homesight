data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  2025: the cash-flow statement treats the reclassification of a 15.85 MSEK loan to short-term as a
  repayment (financing −15.85 MSEK) offset in short-term liabilities (+15.7 MSEK): the loans only
  fell by 0.2 MSEK, so the DEBT check shows −15.65 MSEK "non-loan financing" that is not real.
  Övriga externa kostnader is small (−21 770) because a 300 000 kr reserve for garage property tax
  was reversed; the property tax lines there are left unassigned (+150 229).
  2025 PDF has a broken font map (å/ä/ö); numbers read fine.
  Every year the KF reports only the change in long-term loans as financing; loans moving to short-term
  show up in 'Förändring av kortfristiga skulder'. So the DEBT check always shows a 'non-loan financing'
  gap; the real amortisation is 200–250 kkr a year. Fastighetsavgift/-skatt under övriga externa
  kostnader and förbrukningsinventarier/-material under driftkostnader are left unassigned.
