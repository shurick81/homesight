    - {years: 2026, what: Åtgärda ojämna gångvägar}
    - {years: 2026, what: Nödstopp och fotoceller i garagen}

stambyte:                        # derived from pipe_works.csv; rubric in annual_reviews/brfs/README.md
  as_of: 2026-10-11
  last:
    years: 2023–2024
    kind: stambyte
    scope: []                      # not stated in the reports
    confidence: high
    basis: bergfoten-arrsredovisning-2025.pdf p4 "2024 Stambytet genomfört"; the 2023 report lists "2023-2024 Stambyte".
  next:
    from: 2064
    to: 2074
    status: estimated
    scope: []
    confidence: low
    basis: Last stambyte completed 2024; pipes usually last 40–50 years.
  report: |
    Full stambyte 2023–2024, financed with loans (debt 7 086 kr/m² in 2025). Its scope (bathrooms,
    water pipes) is not stated in the imported reports. No further pipe work for decades; the risk has
    moved from the pipes to the loans and interest.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  Property care and förvaltning are one merged line in the report.
  2012, 2013, 2015, 2017 and 2018 come from HSB's folder (names in sources:); 2014 and 2016 are not found yet, so 2015 and 2017
  are unchained. 2012-2013 use the old HSB layout: Drift (Not 2) includes a Personalkostnader line (stored as 6) and Fastighetsskatt
  is its own RR line, so 1 is Drift minus personnel plus Fastighetsskatt and 30 is Övriga avgifter + Övriga driftskostnader. The
  2012 KF books a new 5 MSEK kortfristig placering as an increase in receivables (liquidity = avräkningskonto + kassa); the 2013 KF
  counts it as liquidity, so its opening liquidity (9 553 389) is in restatements.csv. 2012-2015 have one loan line (cat 1).

sources:                         # listing pages checked by tools/brf/source_gap.py (files in HSB's folder are found by name, no listing page works)
