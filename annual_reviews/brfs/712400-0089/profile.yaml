    - {years: 2024, what: Stambyte}
    - {years: 2024, what: Rensning av ventilationskanaler; OVK; renoverad övernattningslägenhet}
    - {years: 2025, what: Dagvattenledning besiktigad (byte inte nödvändigt)}
  planned_5_years:
    - {years: 2025–2026, what: Se över skyddsrummen (pågår)}
