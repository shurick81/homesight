    basis: The pipes inside the building are original (built 2006–2007); usually 40–50 years. No underhållsplan in 2025.
  report: |
    Built 2006–2007, 29 apartments (2 081 m²). In 2020 the whole sewer system under the house had to be
    replaced after ground settlement broke the pipes: 4.8 MSEK of periodiskt underhåll and a 5.0 MSEK loss
    that year, financed from cash and a new 3 MSEK loan. The pipes in the building are original; the stammar
    were flushed in 2020 and 2024. Loans 22.1 MSEK (10 627 kr/m²) at SBAB, all four resetting in 2026
    (2.56–3.66%). Fees +5% in 2025 and again in February 2026. No current underhållsplan (2025).

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  2020: scanned report (OCR); no kassaflödesanalys, only "Förändring likvida medel", so no cash-flow categories (3, 8–14); interest (7, 15) from the RR. Cash (2) is "Likvida medel vid årets slut" (SBC klientmedel, in Övriga fordringar).
  2020: the 4 805 976 periodiskt underhåll (31) is 4 766 445 VVS (the sewer renovation) + 39 531 garage/parkering.
  2020: "Styrelse och internrevisor" 20 000 stored as styrelsearvoden (44); it includes the elected auditor's fee.
  2020: revisorsuppleant Jörgen Götehed (BoRevision) not stored under 5.
  2025: cash (2) is the KF figure: transaktionskonto 167 295 + Borgo räntekonto 1 057 368 (in Övriga fordringar; no Kassa och bank line).
  2025: "Byggnadernas totalyta är 2 080 kvm" next to 29 bostadsrätter of 2 081 kvm; only the 2 081 is stored (8). 2020 prints 2 080 for both (taxeringsbesked).
  2025: all loans (22.1 MSEK) are short-term, as every rate resets within a year; long-term (1) is printed 0.
  Fastighetsskötsel (2): brandskydd, gemensamma utrymmen, garage, serviceavtal, mattvätt and förbrukningsmaterial stay unassigned (2025: 34%).
  Source: 2025 from Booli's BRF page (found by the user), 2020 from svenskbrf.se; 2021–2024 not found publicly.
