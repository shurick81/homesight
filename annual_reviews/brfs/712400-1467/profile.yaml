stambyte:                        # derived from pipe_works.csv; rubric in annual_reviews/brfs/README.md
  as_of: 2026-10-11
  last:
    years: 1990                    # last work on the stammar in all buildings, and only partial
    kind: partial_stambyte
    scope: [våtrum]                # "Delvis stambyte och nya ytskikt i badrum"; drains not stated
    confidence: medium
    basis: stamma2026.pdf p9 lists 1990 partial stambyte, 2018 stambyte in one building (M104), 2024 reference stambyte in two stammar (M28, M64).
  next:
    from: 2026
    to: 2035
    status: decided                # in_progress | decided | planned | estimated
    scope: [avlopp, våtrum, tappvatten]
    confidence: high
    basis: stamma2026.pdf p9 (plan 2026–2035) and p10 (extra stämma voted for it, contractor procured, Handelsbanken loan commitment).
  report: |
    The original pipes from 1965 have never been replaced across the association: 1990 was a partial
    stambyte with new bathroom surfaces, 2018 covered one building (M104) and 2024 two reference stammar.
    A full stambyte (drains, water pipes, new wet rooms) runs 2026–2035 in stages. It is decided
    and financed, so it is the dominant cost of the coming decade; total cost and fee path are not
    yet in the imported documents.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  Fully itemised operating-cost notes (skötsel, städ, trädgård, snö apart).
  Verified 2011–2025 (2011 unchained, 2012–2025 chained); 2003–2010 imported but not usable (see annual_reviews/brfs/README.md).
  2011–2013 (scans, OCR) use the old HSB layout: the RR has no Personalkostnader or Övriga externa kostnader line, so the personnel
  line of the Drift note (Not 2) is cat 6, Fastighetsskatt joins Driftkostnader (1, 28) and 30 is Övriga avgifter + Övriga
  driftskostnader. Each year's rows come from its own report (an earlier extraction had used the next report's comparison column).
  Liquidity: the 2011 and 2012 reports count avräkningskonto and kassa (stored 2+3); from 2013 the KF also counts placeringskonto and
  kortfristiga placeringar (4, 5), so restatements.csv holds the 2013 opening liquidity (the 2012 comparison column of the 2013 balance
  sheet) and the 2011 opening (the 2011 KF) as the KFs print them. The balance sheet prints loans on one line in 2013-2014; the
  short-term part (0) is the total minus 'Långfristiga skulder exklusive kortfristig del' in Not 16.
  2012: the report's own KF (Årets kassaflöde 7 551 420, working capital +1 099 050) does not tie to its balance sheet: liquidity
  rose 7 550 513 (906 kr less); the 2013 report's comparison column restates it, so the cash check for 2012 reports that difference.

warnings:                        # a caveat about one year, shown to API readers (quality label `note`)
  2012: The year's own cash flow statement is 906 kr off its balance sheet (the next report restates its comparison column).
