data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  Three report layouts: HSB template 2015–2020 (BR lists avräkningskonto and placeringar, stored as 3/4/5),
  Fastighetsägarna 2021–2024 (liquidity includes the förvaltare's client account inside övriga fordringar,
  so state 2 is the KF "Likvida medel"), HSB again 2025 (KF figure, includes the HSB avräkningskonto).
  2016–2020 have planerat underhåll as its own RR line (16); later years have it inside Driftkostnader (31).
  2021–2024 KFs have no interest lines: 7 and 15 come from the RR. "Betald inkomstskatt" in the KF
  (2021 −2 981, 2022 +4 470, 2023 +500) is stored as 56 so that the cash identity holds.
  2023: 15 includes "Resultat från andelar i koncernföretag" 247 kr. 2017: fastighetsskatt is a
  refund (+482 102). 2022: a −61 kr kundförlust reversal is left unassigned in Driftkostnader.
  2024: the RR Driftskostnader (−19 013 891) was restated to −17 702 549 in the 2025 report (HSB layout).
  Debt identity: every year's gap is exactly the KF "Insatser & upplåtelseavgifter" (hyresrätter
  converted to bostadsrätter), not borrowing.
  2011–2015 (scans, OCR; HSB's archive folder hsb.se/contentassets/86f4935…/): the same HSB template, financial figures only
  (FY and the statements; no board or property rows). In 2011–2013 the RR has no Övriga externa kostnader or Personalkostnader:
  Drift (Not 2) includes a Personalkostnader line, which is stored as 6, and Fastighetsskatt is its own RR line, so 1 is Drift minus
  personnel plus Fastighetsskatt (as in later years); 30 is Övriga avgifter + Övriga driftskostnader. 2014 prints all loans on one
  line (stored in 1; the 2015 report splits off 3 000 000 as short-term). 'El, enhetsmätning' and 'Vatten, enhetsmätning' are in 17
  as in 2014+.
  2013: the KF adds back depreciation 5 029 374 (RR 5 059 734) and so ends at 34 057 618, 30 360 below the balance sheet's
  liquidity (34 087 978, stored as 2+3+5); the 2014 report's opening liquidity is the balance sheet figure.
