data_notes: 'Every year 2011-2025 except 2024 is held: 2011-2016, 2022 and 2025 from HSB''s folder (links from the user), 2017-2021 from
  svenskbrf.se and allabrf.se, 2023 from allabrf.se. 2024 is not found (a Hemnet report for "Brf Gösen" is a homonym, org.nr 714400-0481).
  2011-2013 use the old HSB layout: Drift (Not 2) includes a Personalkostnader line (stored as 6) and Fastighetsskatt is its own RR line, so 1
  is Drift minus personnel plus Fastighetsskatt and 30 is Övriga avgifter + Övriga driftskostnader. The 2011-2012 KFs count avräkningskonto
  and kassa as liquidity; from 2013 they also count the kortfristiga placeringar, so restatements.csv holds the 2013 opening liquidity (the
  2012 comparison column). 2014: the RR has Jämförelsestörande poster -300 000 (a settlement with BTH Bygg AB, Not 5), which no category
  holds, so the 2014 cash check is 300 000 off. 2020 has all loans as short-term (cat 0).'

