data_notes: 'Kärrtorp, 70 bostadsrätter (5 785 kvm boyta, no hyresrätter or lokaler) in four houses on tomträtt. The files have a
  broken text layer ((cid:) glyphs, missing letters), so they are read by OCR (ocr: force). In 2023 OCR misses most current-year
  figures of Not 5 and Not 6; those rows (36, 37, 41, 42, 44, 47) are entered from the page image. The KF line Betald skatt is stored
  as 12. Liquidity is kassa, bank and the SBC klientmedel (the 2023 KF opening liquidity is in restatements.csv, since 2022 is not
  held). 2025 is attached to a Bjurfors listing (read by OCR too; its Öresutjämning, -6, merges with the note total and is entered from the page). Board fees (Arvoden styrelse och internrevisor) are 44 in all years. 2021 and 2022 are not found (the association''s own site blocks automated access).'
