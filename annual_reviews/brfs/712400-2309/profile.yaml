stambyte:                        # derived from pipe_works.csv; rubric in annual_reviews/brfs/README.md
  as_of: 2026-10-11
  last:
    years: 2023–2024             # started August 2023; follow-up work finished during 2025
    kind: stambyte
    scope: [avlopp, våtrum]      # drains and all bathrooms (2023-2024 report p4); water pipes not stated
    confidence: high
    basis: >
      arsredovisning-2024-2025-brf-pluto2.pdf p5 "2023-2024 Stambyte och renovering av badrum", p4 total
      cost 86 082 895 kr; hsb-brf-pluto-arsredovisning-2023-2024.pdf p4 "renovera alla badrum och byta avloppsstammar".
  next:
    from: 2065
    to: 2075
    status: estimated
    scope: []
    confidence: low
    basis: Stambyte completed 2024–2025; pipes usually last 40–50 years. Not in the 5-year plan.
  report: |
    Full stambyte with new bathrooms, August 2023 – 2024, finished in 2025. Cost 86.1 MSEK against
    a quote of 79.8 MSEK (ÄTA 6.3 MSEK, 7.8%), plus 5.0 MSEK paid to 36 members who had renovated
    their bathrooms earlier (sparade badrum). Financed with loans: 124.2 MSEK at 2025-06-30, 7 880 kr/m².
    The pipe risk is gone for decades; the cost now sits in the loans and the fees (+2% 2024, +5% 2026).

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  The one-off 5.0 MSEK compensation to members with earlier renovated bathrooms (FY 2024/25) is
  stored under 30 Övriga driftkostnader, see checked_by_eye.csv.
  FY 2020/21 counts property differently (58 lokaler at 0 m², 266 parking and garage places combined);
  later years list garage, p-platser and förråd separately. FY 2020/21: the BR line Kortfristiga placeringar
  is OCR'd as 2 560 000; it is cited from note 12 (2 500 000), which the liquidity total confirms.
  FY 2020/21 Nettoomsättning is cited from note 1 because OCR loses the RR line.
