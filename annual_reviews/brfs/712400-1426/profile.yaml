stambyte:                        # derived from pipe_works.csv; rubric in annual_reviews/brfs/README.md
  as_of: 2026-10-11
  last:
    years: 1999–2000
    kind: stambyte
    scope: []                      # not stated
    confidence: high
    basis: Arsredovisning-BRF-Siken-i-Tyreso-2024.pdf p4 "1999 - 2000 Stambyte har genomförts".
  next:
    from: 2040
    to: 2050
    status: estimated
    scope: []
    confidence: low
    basis: Last stambyte 1999–2000; pipes usually last 40–50 years. Not in the 5-year plan; the underhållsplan (updated 2025-06-09) has not been seen.
  report: |
    Stambyte done 1999–2000, so the pipes are 25 years old. Nothing in the 5-year plan. If the
    1999–2000 work was drains only (common then), the next stambyte could come at the early end of
    the range; the underhållsplan would settle it.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  2018 (scan) and 2019 entered by hand from the OCR text and page images; 2025 is 2025-2026---publik-arsredovisning.pdf in
  HSB's folder. 2025: the note merges Fastighetsskötsel och förvaltning into one line, so 2 holds it (no 29) with Snö (55) as
  its only split. Nothing before 2018/19 is found.
  2023: the 2023/24 report restates the opening cash (12 256 kr moved from Kassa och bank to Övriga fordringar); recorded in restatements.csv.
  2022 and earlier: the BR lists the HSB avräknings- and placeringskonto separately (states 3, 4), so 2 is Kassa och bank only; from 2023 2 is the KF total.
  2020: the report counts 14 lokaler (298 m²), later reports 2–3 (212–243 m²): a changed basis, stored as printed.
  Property care is one merged line in the report (skötsel, lokalvård och samfälligheter).

sources:                         # checked by tools/brf/source_gap.py
