data_notes: 'Öringe, Tyresö (Sidvallsvägen 5-15): 35 bostadsrätter (2 377 kvm) and 40 carport/garage places, built 1997, land owned.
  Reports held: all of 2018-2025. 2019-2021 and 2024 come from the association''s Nabo site; 2018, 2022 and 2023 from allabrf (2018 and
  2023 need a login there, the user supplied the files; the Nabo site has the same reports); 2025 from an estate-agent file on
  mspecsfiles2.blob.core.windows.net. 2018-2023 are printed in tkr: every amount is stored x 1000 and listed in checked_by_eye.csv.
  2018, 2019, 2021 and 2022 are scans (2022 a photographed one) and 2020 has an old OCR text layer, all entered from the page images;
  2023 has broken ligature glyphs. 2018-2022 have no cash flow statement, so no cash is stored for them; the 2023 KF opening
  liquidity and the 2024 one (exact kronor, where the 2023 report rounds to tkr) are in restatements.csv. The 2018 board names are
  printed surname first ("Hermin Lennart"); 2019 onwards prints them first name first, as stored.'
warnings:
  2023: 'The report prints whole tkr; its cash flow items add up to the change in liquidity only within 1 tkr (rounding).'
