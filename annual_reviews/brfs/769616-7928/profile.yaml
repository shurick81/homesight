  report: |
    Newer building (värdeår 2008) on a tomträtt in Kärrtorp. The ground rent, 231 000 kr a year, is fixed
    until 2027-09-30, when the kommun sets a new one from current land values: the main cost risk ahead.
    Loans 26.8 MSEK (7 028 kr/m²) at Stadshypotek, 2.39–2.79%, resetting 2026-10, 2027-12 and 2028-10;
    2 MSEK extra amortisation in 2025. Losses every year (−228 001 kr in 2025); fees +15% in 2025 and +2% in 2026.

data_notes: |                    # caveats about the extracted values, for whoever reads or re-checks them
  2021: BR short-term loans 203 471 vs 200 000 in the loan note (also in the 2022 comparison column); DEBT shows ±3 471 in 2021/2022.
  2021: the board table prints "Cecilia Wassman", the signature page "Cecilia Wassberg"; stored as in the table (p4).
  2021–2022: the income note ("Rörelseintäkter") includes övriga rörelseintäkter, so only 17 and 18 are mapped; the rest of 0 stays unassigned.
  Area basis: 2021–2022 lokalarea 572 m² (total 4 386), 2023 313 m² (total 4 127); stored as printed.
  2022: the extra stämma (Feb 2023) moved a third of the loans (~10 MSEK) to a variable rate (5.05% end of 2023).
  Source: the association's website (2016–2023 on the Ekonomi page, 2025 on the start page); 2024 not found publicly.
  Cash (2) is the KF figure: bank 1 229 463 + Nabo klientmedel 928 609 + Borgo 743 344 (in Övriga fordringar).
  "Byggnadernas totalyta är 4 127 kvm" (p4) is not stored: the report does not say what the 313 m² beyond the 3 814 m² of bostadsrätter is.
  Note 4 "Övrigt" (70 683) stays unassigned under Fastighetsskötsel och lokalvård.
