<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Källvisare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root { --blue:#1f3f95; --blue-light:#7daef2; --card:#e8edf6; --text:#2f3d52; --muted:#5e6b80; --border:#c9d6ec; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.4 system-ui, sans-serif; color:var(--text); display:flex; flex-direction:column; background:#f7f9fd; }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0 8px 0 0; color:var(--blue); }
  label { display:flex; align-items:center; gap:6px; font-weight:600; color:var(--blue); }
  select, input[type=search] { padding:6px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#f6f9ff; color:var(--text); }
  select { max-width:340px; }
  main { flex:1; display:flex; min-height:0; }
  #list { width:420px; max-width:45%; display:flex; flex-direction:column; border-right:1px solid var(--border); background:#fff; }
  #filters { padding:8px; display:flex; gap:6px; border-bottom:1px solid var(--border); }
  #filters input { flex:1; min-width:0; }
  #rows { flex:1; overflow:auto; }
  .group { position:sticky; top:0; background:var(--card); padding:4px 12px; font-size:12px; font-weight:700; text-transform:uppercase; color:#33486f; }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:7px 12px; border-bottom:1px solid #eef3fb; cursor:pointer; }
  .row:hover { background:#eef3fb; }
  .row.active { background:#fff6c7; box-shadow:inset 3px 0 var(--blue); }
  .row .label { overflow-wrap:anywhere; }
  .row .val { font-weight:600; text-align:right; font-variant-numeric:tabular-nums; max-width:180px; overflow-wrap:anywhere; }
  .row .meta { grid-column:1/-1; font-size:12px; color:var(--muted); }
  .nobox { color:#b45309; }
  #viewer { flex:1; display:flex; flex-direction:column; min-width:0; }
  #controls { display:flex; gap:10px; align-items:center; padding:8px 16px; background:#fff; border-bottom:1px solid var(--border); }
  button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:6px 14px; font:inherit; cursor:pointer; }
  button:disabled { background:#ccc; cursor:not-allowed; }
  #info { margin-left:auto; color:var(--muted); font-size:13px; }
  #scroll { flex:1; overflow:auto; padding:16px; text-align:center; }
  #page { position:relative; display:inline-block; box-shadow:0 2px 8px rgba(0,0,0,.2); background:#fff; }
  #canvas { display:block; }
  #hl { position:absolute; display:none; background:rgba(255,235,0,.4); border:2px solid #ff9800; outline:3px solid rgba(102,126,234,.8); pointer-events:none; }
  #empty { color:var(--muted); padding:40px; }
  @media (max-width:800px) { main { flex-direction:column; } #list { width:100%; max-width:none; height:40%; border-right:0; border-bottom:1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>Källvisare</h1>
  <label>BRF <select id="brf"></select></label>
  <label>Dokument <select id="doc"></select></label>
</header>
<main>
  <section id="list">
    <div id="filters">
      <input id="q" type="search" placeholder="Sök fält eller värde…">
      <select id="group"></select>
    </div>
    <div id="rows"></div>
  </section>
  <section id="viewer">
    <div id="controls">
      <button id="prev">‹</button>
      <span>Sida <span id="pnum">–</span> / <span id="pcount">–</span></span>
      <button id="next">›</button>
      <button id="zoomout">−</button><button id="zoomin">+</button>
      <span id="info"></span>
    </div>
    <div id="scroll">
      <div id="empty">Välj ett fält till vänster.</div>
      <div id="page" hidden><canvas id="canvas"></canvas><div id="hl"></div></div>
    </div>
  </section>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = id => document.getElementById(id);
const FIELD = { file:0, group:1, year:2, label:3, value:4, page:5, x:6, y:7, w:8, h:9 };
let data = [], brf, pdf = null, pdfPath = null, pageNum = 1, scale = 1.5, current = null, renderToken = 0;

const fmt = (g, v) => /^-?\d+$/.test(v) ? Number(v).toLocaleString('sv-SE') : v;

async function init() {
  try { data = await (await fetch('source_viewer.json')).json(); }
  catch (e) { $('rows').textContent = 'Kunde inte läsa source_viewer.json (kör tools/brf/build_viewer_data.py och servera sidan över http).'; return; }
  $('brf').innerHTML = data.map(b => `<option value="${b.orgnr}">${b.name} (${b.orgnr})</option>`).join('');
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('brf')) $('brf').value = h.get('brf');
  selectBrf(h.get('doc'));
}

function selectBrf(preferDoc) {
  brf = data.find(b => b.orgnr === $('brf').value) || data[0];
  const files = Object.keys(brf.docs);
  const count = f => brf.fields.filter(x => x[FIELD.file] === f).length;
  $('doc').innerHTML = files.map(f => `<option value="${f}">${brf.docs[f].split('/').slice(-2).join('/')} (${count(f)})</option>`).join('');
  if (preferDoc && files.includes(preferDoc)) $('doc').value = preferDoc;
  selectDoc();
}

function selectDoc() {
  const file = $('doc').value;
  const groups = [...new Set(brf.fields.filter(f => f[FIELD.file] === file).map(f => f[FIELD.group]))];
  $('group').innerHTML = '<option value="">Alla</option>' + groups.map(g => `<option>${g}</option>`).join('');
  renderList();
  history.replaceState(null, '', `#brf=${brf.orgnr}&doc=${encodeURIComponent(file)}`);
}

function renderList() {
  const file = $('doc').value, q = $('q').value.toLowerCase(), g = $('group').value;
  const fields = brf.fields.filter(f => f[FIELD.file] === file && (!g || f[FIELD.group] === g)
    && (!q || (f[FIELD.label] + ' ' + f[FIELD.value] + ' ' + f[FIELD.year]).toLowerCase().includes(q)));
  fields.sort((a, b) => a[FIELD.page] - b[FIELD.page] || (a[FIELD.y] ?? 0) - (b[FIELD.y] ?? 0) || (a[FIELD.x] ?? 0) - (b[FIELD.x] ?? 0));
  let html = '', lastPage = null;
  fields.forEach((f, i) => {
    if (f[FIELD.page] !== lastPage) { lastPage = f[FIELD.page]; html += `<div class="group">Sida ${lastPage}</div>`; }
    html += `<div class="row" data-i="${i}"><span class="label">${esc(f[FIELD.label])}</span>
      <span class="val">${esc(fmt(f[FIELD.group], f[FIELD.value]))}</span>
      <span class="meta">${f[FIELD.group]} · ${esc(f[FIELD.year])}${f[FIELD.x] == null ? ' · <span class="nobox">ingen ruta</span>' : ''}</span></div>`;
  });
  $('rows').innerHTML = html || '<div class="group">Inga fält</div>';
  $('rows').onclick = e => { const r = e.target.closest('.row'); if (r) select(fields[r.dataset.i], r); };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function select(f, row) {
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  row.classList.add('active');
  current = f;
  const path = brf.docs[f[FIELD.file]];
  if (path !== pdfPath) {
    try { pdf = await pdfjsLib.getDocument(encodeURI(path)).promise; pdfPath = path; }
    catch (e) { $('info').textContent = 'Kunde inte ladda ' + path; return; }
    $('pcount').textContent = pdf.numPages;
  }
  await show(f[FIELD.page]);
  const hl = $('hl');
  if (f[FIELD.x] != null) hl.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}

async function show(n) {
  pageNum = Math.min(Math.max(1, n), pdf.numPages);
  const token = ++renderToken;
  const page = await pdf.getPage(pageNum);
  const vp = page.getViewport({ scale });
  const c = $('canvas'), dpr = window.devicePixelRatio || 1;
  c.width = vp.width * dpr; c.height = vp.height * dpr;
  c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  if (token !== renderToken) return;
  $('empty').hidden = true; $('page').hidden = false;
  const hl = $('hl'), f = current;
  if (f && f[FIELD.page] === pageNum && f[FIELD.x] != null) {
    const pad = 2;   // box is in PDF points from top-left; px = points × scale
    Object.assign(hl.style, { display:'block', left:(f[FIELD.x] * scale - pad) + 'px', top:(f[FIELD.y] * scale - pad) + 'px',
      width:(f[FIELD.w] * scale + 2 * pad) + 'px', height:(f[FIELD.h] * scale + 2 * pad) + 'px' });
  } else hl.style.display = 'none';
  $('pnum').textContent = pageNum;
  $('prev').disabled = pageNum <= 1; $('next').disabled = pageNum >= pdf.numPages;
  $('info').textContent = f ? `${f[FIELD.label]}: ${fmt(f[FIELD.group], f[FIELD.value])}` : '';
}

$('brf').onchange = () => { pdf = pdfPath = current = null; selectBrf(); };
$('doc').onchange = () => { current = null; selectDoc(); };
$('q').oninput = renderList; $('group').onchange = renderList;
$('prev').onclick = () => show(pageNum - 1); $('next').onclick = () => show(pageNum + 1);
$('zoomin').onclick = () => { scale = Math.min(3, scale + .25); pdf && show(pageNum); };
$('zoomout').onclick = () => { scale = Math.max(.75, scale - .25); pdf && show(pageNum); };
init();
</script>
</body>
</html>
